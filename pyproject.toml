[project]
name = "output-reporting"
version = "0.1.0"
description = "Output Reporting Data Model"
authors = [{ name = "IBPSA-USA" }]
requires-python = ">=3.10"
dependencies = ["lattice"]

[dependency-groups]
dev = ["doit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["output-reporting"]

[tool.uv.sources]
lattice = { git = "https://github.com/bigladder/lattice.git", branch = "main" }
