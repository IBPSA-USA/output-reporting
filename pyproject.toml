[project]
name = "output-reporting"
version = "0.1.0"
description = "Building Performance Output Report Data Model"
authors = [{ name = "IBPSA-USA" }]
requires-python = ">=3.11"
dependencies = ["lattice"]

[dependency-groups]
dev = ["doit"]
report = ["jinja2", "matplotlib", "pandas", "pyyaml"]

[tool.uv]
default-groups = ["dev", "report"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["output-reporting"]

[tool.uv.sources]
lattice = { git = "https://github.com/bigladder/lattice.git", branch = "updates-for-output-reporting" }
