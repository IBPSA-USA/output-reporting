Schema:
  Object Type: "Meta"
  Title: "Building Performance Output Report"
  Description: "Schema for describing building performance output reports"
  Version: "0.1.0"
  Root Data Group: "BuildingPerformanceOutputReport"

TimeSeriesType:
  Object Type: "Enumeration"
  Enumerators:
    INSTANTANEOUS:
      Description: "Instantaneous"
      Notes: "Values reflect the instant of the current timestamp in the corresponding TimeIntervals data group"
    AVERAGE:
      Description: "Average"
      Notes: "Values reflect the average between the previous timestamp and the current timestamp in the corresponding TimeIntervals data group"
    SUM:
      Description: "Sum"
      Notes: "Values reflect the integrated sum between the previous timestamp and the current timestamp in the corresponding TimeIntervals data group"
    CUMULATIVE:
      Description: "Cumulative"
      Notes: "Values reflect the cumulative sum between the starting timestamp and the current timestamp in the corresponding TimeIntervals data group"

EnergySourceDirection:
  Object Type: "Enumeration"
  Enumerators:
    IMPORTED:
      Description: "Energy imported from an off-site source (e.g., utility grid, delivered fuel)"
    EXPORTED:
      Description: "Energy exported off-site (e.g., surplus on-site generation sold back to the grid)"
    ON_SITE_PRODUCTION:
      Description: "Energy produced on-site (e.g., on-site renewable generation, combined heat and power)"

TimeIntervals:
  Object Type: "Data Group"
  Data Elements:
    id:
      Description: "Reference identification"
      Type: String
      Required: True
      ID: True
    starting_time:
      Description: "Timestamp indicating the beginning of the data"
      Type: Timestamp
      Required: True
      Notes: 'Used to determine the "previous" timestamp for the first value in a time series where the time series type is not `INSTANTANEOUS`'
    regular_interval:
      Description: "Duration of regular interval"
      Type: Numeric
      Units: s
      Constraints: ">0"
      Required: "if !timestamps"
    timestamps:
      Description: "Array of timestamps"
      Type: "Array(Timestamp)"
      Constraints:
        - "[1..]"
      Required: "if !regular_interval"
    labels:
      Description: "Informal labels describing each time interval"
      Type: "Array(String)"
      Constraints:
        - "[1..]"
    notes:
      Description: "Notes about each time interval"
      Type: "Array(String)"
      Constraints:
        - "[1..]"

TimeSeries:
  Object Type: "Data Group"
  Data Elements:
    name:
      Description: "Name of this time series"
      Type: String
      Required: True
    units:
      Description: "Units of measurement for this time series"
      Type: String
      Required: True
    time_series_type:
      Description: "Type of value"
      Type: <TimeSeriesType>
      Required: True
    value_time_intervals:
      Description: "Reference to the TimeIntervals data group associated with this time series"
      Type: ":TimeIntervals:"
      Required: True
    values:
      Description: "Time series data values"
      Type: "Array(Numeric)"
      Constraints:
        - "[1..]"
      Required: True

CanonicalEndUses:
  Object Type: "Custom Attribute"
  Type: "Array(Group(CanonicalCategory))"
  Display Name: "Canonical End Uses"
  Description: "The canonical end-use category names and their standard nesting, for the end uses served by an energy source."
  Applies To: ["Array(Group(EndUse))"]

CanonicalEnergySources:
  Object Type: "Custom Attribute"
  Type: "Array(Group(CanonicalCategory))"
  Display Name: "Canonical Energy Sources"
  Description: "The canonical energy source names reported for a project."
  Applies To: ["Array(Group(EnergySource))"]

# Structural shape only, for use as the value of a "Canonical ..." custom attribute above --
# not a data-bearing group in its own right.
CanonicalCategory:
  Object Type: "Data Group"
  Data Elements:
    name:
      Description: "Name of this canonical category or subcategory"
      Type: String
      Required: True
    subcategories:
      Description: "Canonical subcategories nested under this category"
      Type: "Array(Group(CanonicalCategory))"

EndUse:
  Object Type: "Data Group"
  Data Elements:
    name:
      Description: "Name of this end use or end-use subcategory"
      Type: String
      Required: True
      Notes:
        - "See the canonical end-use categories for recommended names"
        - "Set `is_custom` when using a name outside that list"
    is_custom:
      Description: "Indicates this end use falls outside the canonical categories"
      Type: Boolean
      Notes: "Defaults to false when absent."
    is_unregulated:
      Description: "Indicates this end use's energy is not subject to code-mandated efficiency/power allowances (e.g., process loads)"
      Type: Boolean
      Notes: "Defaults to false when absent."
    subcategories:
      Description: "Further breakdown of this end use's energy consumption"
      Type: "Array(Group(EndUse))"
      Constraints:
        - "[1..]"
      Notes: "Recursive; supports any number of nesting levels."
    consumption:
      Description: "Energy consumption for this end use or subcategory"
      Type: "Group(TimeSeries)"
      Constraints:
        - time_series_type=SUM
        - units="kWh"
      Nested Attribute Overrides:
        Units:
          path: values
          value: "kWh"
    notes:
      Description: "Notes about this end use, e.g. what slice of energy a Fans entry covers"
      Type: "Array(String)"
      Constraints:
        - "[1..]"

EnergySource:
  Object Type: "Data Group"
  Custom Attributes: ["Canonical End Uses"]
  Data Elements:
    name:
      Description: "Name of this energy source"
      Type: String
      Required: True
      Notes:
        - "See the canonical energy sources for recommended names"
        - "Set `is_custom` when using a name outside that list"
    is_custom:
      Description: "Indicates this energy source falls outside the canonical energy sources"
      Type: Boolean
      Notes: "Defaults to false when absent."
    direction:
      Description: "Direction of energy flow relative to the site"
      Type: <EnergySourceDirection>
      Required: True
    end_uses:
      Description: "Array of end uses served by this energy source"
      Type: "Array(Group(EndUse))"
      Constraints:
        - "[1..]"
      Required: True
      Canonical End Uses:
        - name: "Lighting"
          subcategories:
            - name: "Interior Lighting"
            - name: "Exterior Lighting"
        - name: "Space Heating"
          subcategories:
            - name: "Heat Pump Supplementary"
            - name: "Fans"
        - name: "Space Cooling"
          subcategories:
            - name: "Heat Rejection"
            - name: "Fans"
        - name: "Water Heating"
        - name: "Miscellaneous"
          subcategories:
            - name: "Cooking"
            - name: "Refrigeration"
            - name: "Elevators and Escalators"
        - name: "Fans"
        - name: "Humidification"
        - name: "Pumps"

BuildingPerformanceOutputReport:
  Object Type: "Data Group"
  Custom Attributes: ["Canonical Energy Sources"]
  Data Elements:
    metadata:
      Description: "Metadata"
      Type: "Group(Metadata)"
      Constraints: schema_name="Building Performance Output Report"
      Required: True
    time_intervals:
      Description: "Array of TimeIntervals data groups whose ids may be referenced within TimeSeries data groups"
      Type: "Array(Group(TimeIntervals))"
      Required: True
      Constraints:
        - "[1..]"
    energy_sources:
      Description: "Array of energy sources reported for this project"
      Type: "Array(Group(EnergySource))"
      Required: True
      Constraints:
        - "[1..]"
      Canonical Energy Sources:
        - name: "Electricity"
        - name: "Natural Gas"
        - name: "Fuel Oil"
        - name: "Propane"
        - name: "Chilled Water"
        - name: "Hot Water"
        - name: "Steam"
